[workspace]
resolver = "3"
members = ["crates/data_structure", "crates/leetcode"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Tzcan <tzcan@foxmail.com>"]
repository = "https://github.com/tellcts/Rust-learn"

[profile.dev]
opt-level = 0
debug = true

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[workspace.dependencies]
rstest = { version = "0.28.0" }
rstest_reuse = { version = "0.7.1" }
